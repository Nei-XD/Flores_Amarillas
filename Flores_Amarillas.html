<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Para Ti</title>
    <style>
        /* =========================================
           VARIABLES Y RESET
           ========================================= */
        :root {
            --gold: #ffd700;
            --gold-glow: #ffaa00;
            --bg-dark: #0a0a10;
            --bg-light: #1a1a2e;
            --green-stem: #2e7d32;
            --green-leaf: #1b5e20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* =========================================
           TELÓN DE BIENVENIDA (SOLUCIÓN AL AUTOPLAY)
           ========================================= */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 16, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-text {
            font-size: 1.5rem;
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
            animation: pulseGlow 2s infinite alternate;
            text-align: center;
            padding: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.05);
        }

        .overlay-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: float 2s ease-in-out infinite;
        }

        /* =========================================
           FONDO ESTRELLADO Y PARTÍCULAS
           ========================================= */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffd700, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #ffd700, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite alternate;
            z-index: 1;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .particle {
            position: absolute;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 2;
            animation: fallSpin linear forwards;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6));
        }

        @keyframes fallSpin {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* =========================================
           CONTENEDOR PRINCIPAL
           ========================================= */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            color: #fff8b0;
            line-height: 1.1;
            text-shadow: 
                0 0 5px #fff, 0 0 10px var(--gold), 0 0 20px var(--gold),
                0 0 40px var(--gold-glow), 0 0 80px var(--gold-glow);
            margin-bottom: 10px;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px var(--gold), 0 0 20px var(--gold), 0 0 40px var(--gold-glow); }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px var(--gold), 0 0 30px var(--gold), 0 0 60px var(--gold-glow), 0 0 100px var(--gold-glow); }
        }

        .sunflower-emoji {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 10px var(--gold));
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* =========================================
           REPRODUCTOR DE MÚSICA
           ========================================= */
        .player-container {
            background: rgba(30, 20, 10, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            margin-bottom: 30px;
        }

        .play-btn {
            background: var(--gold);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #000;
            font-size: 1.2rem;
            box-shadow: 0 0 15px var(--gold-glow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .track-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff8b0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--gold);
            border-radius: 2px;
            width: 0%;
            box-shadow: 0 0 10px var(--gold);
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* =========================================
           RAMO DE GIRASOLES Y VIENTO (EXTENDIDO)
           ========================================= */
        .bouquet-wrapper {
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transform-origin: bottom center;
            animation: windSway 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
        }

        @keyframes windSway {
            0% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
            100% { transform: rotate(-2deg); }
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .petal { fill: url(#petalGradient); }
        .center { fill: url(#centerGradient); }
        .stem { fill: none; stroke: var(--green-stem); stroke-width: 7; stroke-linecap: round; }
        .leaf { fill: var(--green-leaf); }
        
        .flower-group {
            animation: flowerGlow 3s infinite alternate;
        }
        @keyframes flowerGlow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.2); }
        }
    </style>
</head>
<body>

    <!-- Telón de Bienvenida (Captura el primer toque para iniciar la música) -->
    <div id="overlay">
        <div class="overlay-icon">🌻</div>
        <div class="overlay-text">
            Toca la pantalla<br>para ver tu sorpresa
        </div>
    </div>

    <!-- Fondo de estrellas estáticas -->
    <div class="stars-bg"></div>

    <!-- Audio -->
    <audio id="bgMusic" src="Flores-amarillas.mp3" loop></audio>

    <div class="container">
        <h1 class="title">Flores<br>Para Ti</h1>
        <div class="sunflower-emoji">🌻</div>

        <!-- Reproductor de Música -->
        <div class="player-container">
            <button class="play-btn" id="playBtn">
                <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            <div class="track-info">
                <div class="track-title">Feliz 21 de septiembre ❤️</div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </div>

        <!-- Ramo de Girasoles (SVG Extendido) -->
        <div class="bouquet-wrapper">
            <svg viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#3e2723"/>
                        <stop offset="70%" stop-color="#5d4037"/>
                        <stop offset="100%" stop-color="#21120f"/>
                    </radialGradient>
                    
                    <linearGradient id="petalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#fff176"/>
                        <stop offset="50%" stop-color="#ffeb3b"/>
                        <stop offset="100%" stop-color="#fbc02d"/>
                    </linearGradient>

                    <g id="sunflower">
                        <g class="flower-group">
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(30)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(60)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(90)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(120)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(150)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(180)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(210)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(240)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(270)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(300)" />
                            <path class="petal" d="M0,-60 C15,-60 20,-30 0,-15 C-20,-30 -15,-60 0,-60 Z" transform="rotate(330)" />
                            <circle class="center" cx="0" cy="0" r="25"/>
                            <circle cx="0" cy="0" r="18" fill="none" stroke="#4e342e" stroke-width="2" stroke-dasharray="4 4"/>
                            <circle cx="0" cy="0" r="10" fill="none" stroke="#3e2723" stroke-width="2" stroke-dasharray="3 3"/>
                        </g>
                    </g>
                </defs>

                <path class="stem" d="M200,420 Q190,300 200,150" />
                <path class="stem" d="M200,420 Q140,300 120,200" />
                <path class="stem" d="M200,420 Q260,300 280,200" />
                <path class="stem" d="M200,420 Q100,320 70,260" />
                <path class="stem" d="M200,420 Q300,320 330,260" />
                <path class="stem" d="M200,420 Q170,350 140,290" />
                <path class="stem" d="M200,420 Q230,350 260,290" />
                <path class="stem" d="M200,420 Q200,320 200,250" />

                <path class="leaf" d="M190,380 Q130,360 100,400 Q140,420 190,390" />
                <path class="leaf" d="M210,380 Q270,360 300,400 Q260,420 210,390" />
                <path class="leaf" d="M170,330 Q110,300 80,330 Q120,360 170,340" />
                <path class="leaf" d="M230,330 Q290,300 320,330 Q280,360 230,340" />
                <path class="leaf" d="M150,280 Q100,250 80,280 Q110,310 150,290" />
                <path class="leaf" d="M250,280 Q300,250 320,280 Q290,310 250,290" />

                <use href="#sunflower" transform="translate(120, 200) scale(0.8)" />
                <use href="#sunflower" transform="translate(280, 200) scale(0.8)" />
                <use href="#sunflower" transform="translate(70, 260) scale(0.7)" />
                <use href="#sunflower" transform="translate(330, 260) scale(0.7)" />
                
                <use href="#sunflower" transform="translate(200, 150) scale(1)" />
                <use href="#sunflower" transform="translate(140, 290) scale(0.9)" />
                <use href="#sunflower" transform="translate(260, 290) scale(0.9)" />
                
                <use href="#sunflower" transform="translate(200, 250) scale(1.1)" />
            </svg>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // =========================================
        // 1. REPRODUCTOR DE MÚSICA (CON TELÓN DE BIENVENIDA)
        // =========================================
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const overlay = document.getElementById('overlay');

        let isPlaying = false;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateUI(playing) {
            if (playing) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                isPlaying = true;
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                isPlaying = false;
            }
        }

        // Intentar reproducir automáticamente al 1 segundo
        window.addEventListener('load', () => {
            setTimeout(() => {
                audio.play().then(() => {
                    // ÉXITO: El navegador permitió el autoplay
                    updateUI(true);
                    overlay.classList.add('hidden'); // Ocultar telón
                }).catch(error => {
                    // BLOQUEO: El navegador bloqueó el autoplay
                    console.log("Autoplay bloqueado. Esperando interacción en el telón.");
                    updateUI(false);
                    // El telón se queda visible esperando el toque
                });
            }, 1000);
        });

        // Al tocar el telón, iniciar música y quitarlo
        overlay.addEventListener('click', () => {
            audio.play().then(() => {
                updateUI(true);
                overlay.classList.add('hidden');
            });
        });

        // Botón de Play/Pausa manual
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                updateUI(false);
            } else {
                audio.play();
                updateUI(true);
            }
        });

        // Actualizar barra de progreso
        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${progress}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        // Cargar duración
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        // Clic en la barra para adelantar/retroceder
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        // =========================================
        // 2. PARTÍCULAS DE GIRASOLES CAYENDO
        // =========================================
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            particle.textContent = '🌻';
            particle.style.left = Math.random() * 100 + 'vw';
            
            const size = Math.random() * 1.5 + 1;
            particle.style.fontSize = size + 'rem';
            
            const duration = Math.random() * 4 + 6;
            particle.style.animationDuration = duration + 's';
            particle.style.animationDelay = Math.random() * 2 + 's';
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, duration * 1000 + 2000);
        }

        setInterval(createParticle, 400);

        for (let i = 0; i < 5; i++) {
            setTimeout(createParticle, i * 300);
        }
    </script>
</body>
</html>
